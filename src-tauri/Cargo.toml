[package]
name = "streamtunnel"
version = "0.1.3"
description = "P2P screen and game sharing with ultra-low latency"
edition = "2021"
rust-version = "1.90"

[lib]
name = "streamtunnel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
# Share sound via WASAPI process loopback (src/sysaudio.rs); uses the same `windows` crate as Tauri.
wasapi = "0.26"
# Already part of Tauri's dependency tree, so this adds no binary size.
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

# Linux: WebKitGTK has no WebRTC → media through GStreamer webrtcbin (docs/LINUX.md). The GStreamer libraries are
# system packages (like webkit2gtk itself); serde/serde_json are already part of Tauri's dependency tree.
[target.'cfg(target_os = "linux")'.dependencies]
st-linux-media = { path = "linux-media" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
