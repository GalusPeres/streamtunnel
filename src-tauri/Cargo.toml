[package]
name = "streamtunnel"
version = "0.1.1"
description = "P2P screen and game sharing with ultra-low latency"
edition = "2021"
rust-version = "1.90"

[lib]
name = "streamtunnel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
# Already part of Tauri's dependency tree, so this adds no binary size.
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
