[package]
name = "streamtunnel"
version = "0.2.9"
description = "P2P screen and game sharing with ultra-low latency"
edition = "2021"
rust-version = "1.90"

[lib]
name = "streamtunnel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native media path (docs/NATIVE-PATH.md): capture + NVENC on Windows, the stm/1 UDP transport on every OS.
st-media = { path = "st-media" }
# Command arguments / results of the native path; already part of Tauri's dependency tree.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# In-app updates (src/update.rs) with the system's TLS (no bundled rustls). Only the macOS bundle comes as a tar.gz
# (`zip` feature); Windows gets the setup .exe, Linux the AppImage / .deb / binary itself.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
# Share sound via WASAPI process loopback (src/sysaudio.rs); uses the same `windows` crate as Tauri.
wasapi = "0.26"
# Already part of Tauri's dependency tree, so this adds no binary size.
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

# Linux: WebKitGTK has no WebRTC → media through GStreamer webrtcbin (docs/LINUX.md). The GStreamer libraries are
# system packages (like webkit2gtk itself).
[target.'cfg(target_os = "linux")'.dependencies]
st-linux-media = { path = "linux-media" }

# The native path in a debug app (tauri dev): per-packet AES-GCM and the Reed-Solomon parity are 10-50x slower
# unoptimized (loopback p50 6 ms instead of 0.3 ms, key frames 40 ms), so these crates are optimized even in debug.
[profile.dev.package]
st-media = { opt-level = 3 }
aes = { opt-level = 3 }
aes-gcm = { opt-level = 3 }
ctr = { opt-level = 3 }
ghash = { opt-level = 3 }
polyval = { opt-level = 3 }
reed-solomon-simd = { opt-level = 3 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
