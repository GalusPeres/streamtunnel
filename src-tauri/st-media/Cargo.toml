[package]
name = "st-media"
version = "0.1.0"
description = "StreamTunnel native media path: Windows capture + NVENC and the stm/1 UDP transport (docs/NATIVE-PATH.md)"
edition = "2021"
rust-version = "1.90"
publish = false

# Small pure-Rust crates only (no FFmpeg, no SDK binaries). Most of these are already in Tauri's dependency tree.
[dependencies]
# AEAD of every stm/1 packet (RustCrypto, MIT OR Apache-2.0). No default features: no second getrandom.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# per-link keys: an ephemeral X25519 Diffie-Hellman over the public keys exchanged in the E2E-encrypted signaling, so
# the room code alone does not open the media (pure Rust, BSD-3-Clause: ship the notice). No precomputed tables
# (one key pair per link). Its `getrandom` is the 0.4 Tauri already has (via uuid).
x25519-dalek = { version = "3", default-features = false, features = ["zeroize", "getrandom"] }
# HKDF over the shared secret (MIT OR Apache-2.0)
hkdf = "0.12"
sha2 = "0.10"
# OS randomness: link ids, STUN transaction ids (already in Tauri's tree)
getrandom = "0.3"
# per-frame forward error correction (Leopard RS, licence MIT AND BSD-3-Clause: ship the BSD notice)
reed-solomon-simd = "3.1"
# the app's one dual-stack UDP socket (IPV6_V6ONLY off); already in Tauri's tree
socket2 = "0.6"
# stats structs → JSON in the Tauri glue (already in Tauri's tree)
serde = { version = "1", features = ["derive"] }

# host candidates via getifaddrs
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: WGC capture, D3D11, NVENC (nvEncodeAPI64.dll loaded at runtime) and GetAdaptersAddresses. The same
# `windows` 0.62 Tauri already uses (one copy); only features are added. WIN owns the Graphics/Direct3D/Dxgi/
# LibraryLoader features, NET the NetworkManagement/Networking/Media ones.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Metadata",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_WindowsAndMessaging",
] }

# Debug builds (`cargo test` here): per-packet AES-GCM and the Reed-Solomon parity are 10-50x slower unoptimized and
# would add milliseconds per frame that a release build does not have, so these crates are optimized even in debug
# and the tests time the transport. Only used when st-media is built on its own; the app's Cargo.toml says the same.
[profile.dev.package]
st-media = { opt-level = 3 }
aes = { opt-level = 3 }
aes-gcm = { opt-level = 3 }
ctr = { opt-level = 3 }
ghash = { opt-level = 3 }
polyval = { opt-level = 3 }
reed-solomon-simd = { opt-level = 3 }
