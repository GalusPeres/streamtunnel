name: Build

# Desktop apps for Windows / macOS via tauri-action, Linux = the same Tauri app with its media through GStreamer
# (job linux-tauri, docs/LINUX.md), plus the single-file web version (StreamTunnel.html). Every run
# uploads the bundles as workflow artifacts; a pushed tag "v*" also collects them into a draft GitHub release.
# Builds are not code-signed; the in-app updater's files are signed with the project's minisign key (secret
# TAURI_SIGNING_PRIVATE_KEY, public key in tauri.conf.json) and listed in the release's latest.json.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rust_targets: ''
            args: --bundles nsis
            bundle_dir: src-tauri/target/release/bundle
          # Apple-silicon app, cross-compiled on an Intel runner: GitHub's arm64 macOS runners were often out
          # of capacity (jobs cancelled as 'not acquired by Runner'), the Intel pool starts right away.
          - name: macos-arm64
            os: macos-15-intel
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
            bundle_dir: src-tauri/target/aarch64-apple-darwin/release/bundle
    env:
      # electron is a devDependency for the Linux build only; skip its ~100 MB binary here
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.name }}

      - name: Install npm dependencies
        run: npm ci

      # Runs `npm run tauri build -- <args>`; tauri.conf.json's beforeBuildCommand is `npm run build`
      # (tsc + vite build). No tagName/releaseId → build only; the release job below publishes.
      # createUpdaterArtifacts: the setup .exe / the .app.tar.gz get a .sig next to them.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          args: ${{ matrix.args }}

      # Only the installers/images (a bare .app directory would lose its exec bits inside the artifact zip), the
      # macOS update bundle (.app.tar.gz) and the updater signatures.
      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: streamtunnel-${{ matrix.name }}
          path: |
            ${{ matrix.bundle_dir }}/nsis/*.exe
            ${{ matrix.bundle_dir }}/nsis/*.exe.sig
            ${{ matrix.bundle_dir }}/dmg/*.dmg
            ${{ matrix.bundle_dir }}/macos/*.app.tar.gz
            ${{ matrix.bundle_dir }}/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 30

  # Linux desktop app = the same small Tauri app. WebKitGTK has no WebRTC, so on Linux the media runs through
  # GStreamer webrtcbin in Rust (src-tauri/linux-media) and video is decoded by WebCodecs in the page
  # (docs/LINUX.md). GStreamer comes from the system like webkit2gtk. Verified headless: Chrome shares the test
  # picture into a tunnel, the built app (Xvfb) watches it and checks decoded frames.
  linux-tauri:
    name: Desktop (linux-tauri)
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: linux-tauri

      # Build deps (webkit2gtk + GStreamer headers) and the runtime plugins the watch path needs
      # (webrtcbin/dtls/srtp/sctp: bad, nice: libnice, H.264 decode for WebCodecs: libav; ugly: x264enc for the
      # engine's loopback test only).
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf file xdg-utils \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-nice gstreamer1.0-libav gstreamer1.0-pulseaudio gstreamer1.0-tools xvfb xauth
          gst-inspect-1.0 --version
          gst-inspect-1.0 webrtcbin | head -n 12

      - name: Install npm dependencies
        run: npm ci

      - name: Media engine loopback test (GStreamer sender → engine, no browser)
        run: cargo test --manifest-path src-tauri/linux-media/Cargo.toml --target-dir src-tauri/target -- --nocapture

      # libgst* stay out of the AppImage: GStreamer core and plugins must come from the same (system) install,
      # a bundled older core rejects newer system plugins.
      - name: Build Tauri app (AppImage + deb)
        env:
          LINUXDEPLOY_EXCLUDED_LIBRARIES: 'libgst*'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run tauri build -- --bundles appimage,deb

      # The tarball's binary (and the Arch package's) updates itself from a signed copy of the bare binary
      # (src-tauri/src/update.rs).
      - name: Package binary tarball (system libraries, smallest download)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          set -e
          V=$(node -p "require('./package.json').version")
          mkdir -p pkg/StreamTunnel
          cp src-tauri/target/release/streamtunnel pkg/StreamTunnel/
          cp src-tauri/icons/128x128.png pkg/StreamTunnel/streamtunnel.png
          cp packaging/linux/streamtunnel.desktop packaging/linux/README.txt pkg/StreamTunnel/
          tar -C pkg -czf "pkg/StreamTunnel-$V-Linux-x86_64.tar.gz" StreamTunnel
          cp src-tauri/target/release/streamtunnel "pkg/StreamTunnel-$V-Linux-x86_64-Update.bin"
          npx tauri signer sign "pkg/StreamTunnel-$V-Linux-x86_64-Update.bin"
          echo "### Linux bundle sizes" >> "$GITHUB_STEP_SUMMARY"
          ls -l src-tauri/target/release/streamtunnel src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb pkg/*.tar.gz \
            | awk '{printf "- %s: %.1f MB\n", $NF, $5/1048576}' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "GStreamer libraries inside the AppImage (should be none):"
          (cd /tmp && "$GITHUB_WORKSPACE"/src-tauri/target/release/bundle/appimage/*.AppImage --appimage-extract >/dev/null 2>&1 && find squashfs-root -name 'libgst*' | head -n 20; rm -rf squashfs-root) || true
          dpkg-deb -I src-tauri/target/release/bundle/deb/*.deb | grep -i depends

      # Public MQTT brokers are occasionally slow from CI runners → one retry.
      - name: Headless E2E (Chrome shares → Linux app watches through GStreamer + WebCodecs)
        run: |
          for attempt in 1 2; do
            echo "::group::attempt $attempt"
            if xvfb-run -a -s "-screen 0 1280x800x24" node tests/e2e/linux-tauri.mjs; then echo "::endgroup::"; exit 0; fi
            echo "::endgroup::"
          done
          exit 1

      - name: Upload bundles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: streamtunnel-linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            pkg/*.tar.gz
            pkg/*-Update.bin
            pkg/*-Update.bin.sig
          if-no-files-found: warn
          retention-days: 30

  web:
    name: Web (single file)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build StreamTunnel.html
        run: npm run build:web

      - name: Upload StreamTunnel.html
        uses: actions/upload-artifact@v7
        with:
          name: streamtunnel-web
          path: dist-web/StreamTunnel.html
          if-no-files-found: error
          retention-days: 30

  # Offline unit tests only (live public-broker tests are skipped with ST_OFFLINE=1; they are flaky in CI).
  # Informational: does not gate the release.
  test:
    name: Unit tests (offline)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          ST_OFFLINE: '1'

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, linux-tauri, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: Download all bundles
        uses: actions/download-artifact@v8
        with:
          pattern: streamtunnel-*
          path: release-assets
          merge-multiple: true

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          # Clear, human file names per platform (each updater signature follows its file)
          ren() {
            find release-assets -name "$1" -exec mv {} "release-assets/$2" \;
            find release-assets -name "$1.sig" -exec mv {} "release-assets/$2.sig" \;
          }
          ren "*_x64-setup.exe" "StreamTunnel-$V-Windows-Setup.exe"
          ren "*_aarch64.dmg" "StreamTunnel-$V-Mac.dmg"
          ren "*.app.tar.gz" "StreamTunnel-$V-Mac-Update.app.tar.gz"
          ren "StreamTunnel.html" "StreamTunnel-$V-Browser.html"
          ren "*_amd64.AppImage" "StreamTunnel-$V-Linux.AppImage"
          ren "*_amd64.deb" "StreamTunnel-$V-Linux.deb"
          # already named by the linux job, but inside the artifact's pkg/ folder: up to the top like the rest
          ren "*-Update.bin" "StreamTunnel-$V-Linux-x86_64-Update.bin"
          # latest.json for the in-app updater (src-tauri/src/update.rs): one entry per kind of install; the
          # signatures go into it instead of the release
          V="$V" U="https://github.com/$GH_REPO/releases/download/$TAG" node .github/latest-json.mjs
          find release-assets -name "*.sig" -delete
          mapfile -t files < <(find release-assets -type f | sort)
          printf 'Asset: %s\n' "${files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then echo "No release assets found" >&2; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber && gh release edit "$TAG" --notes-file .github/RELEASE_NOTES.md
          else
            gh release create "$TAG" "${files[@]}" --draft --verify-tag --notes-file .github/RELEASE_NOTES.md --title "StreamTunnel $TAG"
          fi
