name: Build

# Desktop apps for Windows / macOS (Apple Silicon + Intel) via tauri-action, Linux via Electron (Tauri on Linux
# runs on WebKitGTK, which has no WebRTC), plus the single-file web version (StreamTunnel.html). Every run
# uploads the bundles as workflow artifacts; a pushed tag "v*" also collects them into a draft GitHub release.
# Builds are unsigned.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rust_targets: ''
            args: --bundles nsis
            bundle_dir: src-tauri/target/release/bundle
          - name: macos-arm64
            os: macos-latest
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
            bundle_dir: src-tauri/target/aarch64-apple-darwin/release/bundle
    env:
      # electron is a devDependency for the Linux build only; skip its ~100 MB binary here
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.name }}

      - name: Install npm dependencies
        run: npm ci

      # Runs `npm run tauri build -- <args>`; tauri.conf.json's beforeBuildCommand is `npm run build`
      # (tsc + vite build). No tagName/releaseId → build only; the release job below publishes.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}

      # Only the installers/images: a bare .app directory would lose its exec bits inside the artifact zip.
      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: streamtunnel-${{ matrix.name }}
          path: |
            ${{ matrix.bundle_dir }}/nsis/*.exe
            ${{ matrix.bundle_dir }}/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  # Linux desktop app: Electron (Chromium -> WebRTC, WebCrypto, PipeWire screen capture) around the same dist/.
  web:
    name: Web (single file)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build StreamTunnel.html
        run: npm run build:web

      - name: Upload StreamTunnel.html
        uses: actions/upload-artifact@v7
        with:
          name: streamtunnel-web
          path: dist-web/StreamTunnel.html
          if-no-files-found: error
          retention-days: 30

  # Offline unit tests only (live public-broker tests are skipped with ST_OFFLINE=1; they are flaky in CI).
  # Informational: does not gate the release.
  test:
    name: Unit tests (offline)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          ST_OFFLINE: '1'

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: Download all bundles
        uses: actions/download-artifact@v8
        with:
          pattern: streamtunnel-*
          path: release-assets
          merge-multiple: true

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          # Clear, human file names per platform
          find release-assets -name "*_x64-setup.exe" -exec mv {} "release-assets/StreamTunnel-$V-Windows-Setup.exe" ;
          find release-assets -name "*_aarch64.dmg" -exec mv {} "release-assets/StreamTunnel-$V-Mac.dmg" ;
          find release-assets -name "StreamTunnel.html" -exec mv {} "release-assets/StreamTunnel-$V-Browser-Linux.html" ;
          mapfile -t files < <(find release-assets -type f | sort)
          printf 'Asset: %s\n' "${files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then echo "No release assets found" >&2; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber && gh release edit "$TAG" --notes-file .github/RELEASE_NOTES.md
          else
            gh release create "$TAG" "${files[@]}" --draft --verify-tag --notes-file .github/RELEASE_NOTES.md --title "StreamTunnel $TAG"
          fi
